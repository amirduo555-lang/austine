```html
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이미지 랜딩페이지</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      overflow-x: hidden;
    }

    /* 이미지 섹션 */
    .image-section {
      position: relative;
      width: 100%;
      overflow: hidden;
      line-height: 0;
    }

    /* 배경 이미지: 섹션을 꽉 채우고 넘치는 부분 자르기 */
    .background-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
    }

    /* 메인 이미지 영역: 이미지 높이에 맞춰 섹션 높이 결정 */
    .overlay-content {
      position: relative;
      z-index: 1;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 메인 이미지: 최대 600px, 모바일은 화면 너비에 맞춤 */
    .main-image {
      display: block;
      width: 100%;
      max-width: 600px;
      height: auto;
    }

    /* 모바일 대응 */
    @media (max-width: 600px) {
      .main-image {
        width: 100%;
        max-width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- 섹션 1 -->
  <section class="image-section">
    <img
      src="./배경1.png"
      alt=""
      class="background-image"
    >

    <div class="overlay-content">
      <img
        src="./1번.png"
        alt="메인 이미지 1"
        class="main-image"
      >
    </div>
  </section>

  <!-- 섹션 2 -->
  <section class="image-section">
    <img
      src="./배경2.png"
      alt=""
      class="background-image"
    >

    <div class="overlay-content">
      <img
        src="./2번.png"
        alt="메인 이미지 2"
        class="main-image"
      >
    </div>
  </section>

</body>
</html>
```
