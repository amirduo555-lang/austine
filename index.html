<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>이미지 랜딩페이지</title>

  <style>
    /* 기본 설정 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      overflow-x: hidden;
    }

    /* 공통 이미지 섹션 */
    .image-section {
      position: relative;
      width: 100%;
      overflow: hidden;
      line-height: 0;
    }

    /* 배경 이미지: 화면 가로폭 전체 */
    .background-image {
      display: block;
      width: 100%;
      height: auto;
    }

    /* 위에 올라가는 이미지 정렬 영역 */
    .overlay-content {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    /* 메인 이미지: 최대 600px */
    .main-image {
      display: block;
      width: 100%;
      max-width: 600px;
      height: auto;
      object-fit: contain;
    }

    /* 모바일 대응 */
    @media (max-width: 600px) {
      .main-image {
        width: 100%;
        max-width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- 섹션 1 -->
  <section class="image-section">
    <img
      src="배경1.png"
      alt=""
      class="background-image"
    >

    <div class="overlay-content">
      <img
        src="1번.png"
        alt="메인 이미지 1"
        class="main-image"
      >
    </div>
  </section>

  <!-- 섹션 2 -->
  <section class="image-section">
    <img
      src="배경2.png"
      alt=""
      class="background-image"
    >

    <div class="overlay-content">
      <img
        src="2번.png"
        alt="메인 이미지 2"
        class="main-image"
      >
    </div>
  </section>

</body>
</html>
